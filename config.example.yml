# SoulNotes Configuration
# Copy this file to config.yml and customize as needed
# For Docker: mount config.yml to /app/config.yml or /app/data/config.yml
# For Tauri: place config.yml next to the executable
# Default: localhost (override in config.local.yml for production server)

# LLM Provider Selection
# Determines which backend is used for translation, summarization, and conversation
# Options: "ollama" (default) or "openai-compatible"
# "openai-compatible" supports llama.cpp, LM Studio, vLLM, text-generation-webui, etc.
llm_provider: "ollama"

# Speaches (Real-time Transcription) Settings
speaches_base_url: "http://127.0.0.1:10300"
speaches_transcribe_model: "Systran/faster-whisper-large-v3"
speaches_transcribe_language: "zh"

# Ollama (Translation & Summarization) Settings
# Used when llm_provider is "ollama"
ollama_base_url: "http://127.0.0.1:10102"
# API token for authenticated Ollama instances (optional)
# In desktop mode, this is stored securely in OS credential storage (Keychain/Credential Manager)
# In web/Docker mode, use the OLLAMA_API_TOKEN environment variable instead
ollama_api_token: null
ollama_translate_model: "aya-expanse:latest"
ollama_summarize_model: "phi4:latest"
ollama_conversation_model: "aya-expanse:latest"  # Model for AI conversation partner

# OpenAI-Compatible (Translation & Summarization) Settings
# Used when llm_provider is "openai-compatible"
# Compatible with llama.cpp, LM Studio, vLLM, text-generation-webui, and any
# server implementing the OpenAI /v1/chat/completions API
openai_compatible_base_url: "http://127.0.0.1:8080"
# API token for authenticated endpoints (optional)
# In desktop mode, this is stored securely in OS credential storage
# In web/Docker mode, use the OPENAI_COMPATIBLE_API_TOKEN environment variable instead
openai_compatible_api_token: null
openai_compatible_translate_model: null      # Set to model name served by your endpoint
openai_compatible_summarize_model: null      # Set to model name served by your endpoint
openai_compatible_conversation_model: null   # Set to model name served by your endpoint

# Audio Device Settings (Tauri only - persists selected devices)
# These are saved automatically when you select devices in the UI
mic_device: null        # Microphone device name (e.g., "Microphone (USB)")
system_audio_device: null  # System audio device name for loopback capture
capture_mode: null      # "mic", "system", or "dual"

# Custom Prompts
# Use {source_language}, {target_language}, and {text} as placeholders
# These will be replaced at runtime

# Translation Prompt
# The prompt used for translating text between languages
# Supports: context-aware translation, technical term preservation, speaker attribution
translate_prompt: |
  You are a professional translator. Translate the following text from {source_language} to {target_language}.

  ## TRANSLATION GUIDELINES

  ### Accuracy
  - Translate meaning and intent, not just words
  - Preserve the original tone (formal, casual, technical, etc.)
  - Maintain speaker attribution if present (e.g., "John:", "Speaker 1:")

  ### Technical Terms
  - Keep domain-specific technical terms in their original form if commonly used
  - Provide brief context in parentheses for unfamiliar terms: "term (context)"
  - Preserve acronyms unless there's a well-known translation

  ### Structure
  - Maintain original paragraph breaks and formatting
  - Preserve bullet points, numbering, and indentation
  - Keep timestamps or time references in original format

  ### Idioms & Cultural Context
  - Translate idioms to their closest equivalent in the target language
  - If no equivalent exists, provide a literal translation with context
  - Preserve cultural references with brief explanation if needed

  ### Output Format
  - Output ONLY the translated text
  - Use clear paragraph breaks with blank lines between paragraphs
  - Do not add explanations, notes, or commentary

  ## TEXT TO TRANSLATE:
  {text}

# Summarization Prompt
# The prompt used for generating comprehensive summaries
# Features: content type detection, proactive insights, context capture
summarize_prompt: |
  Analyze the following transcribed content and create a comprehensive summary. First, identify the content type, then structure your response accordingly.

  ## CONTENT TYPE DETECTION
  Determine if this is:
  - MEETING: Multi-party discussion with decisions/action items
  - LECTURE: Educational presentation with concepts to learn
  - INTERVIEW: Q&A format between parties
  - PERSONAL: Single speaker notes, thoughts, or reminders
  - DISCUSSION: Multiple viewpoints on topics without formal decisions

  ## OUTPUT FORMAT

  # [Appropriate Title Based on Content]

  ## CONTENT TYPE: [Detected Type]

  ## EXECUTIVE SUMMARY
  [2-3 sentence overview of the main purpose and outcome]

  ## KEY INFORMATION

  ### Main Topics Covered
  - [Topic with brief context]

  ### Important Points
  - [Key point with attribution if identifiable]

  ## ACTION ITEMS & COMMITMENTS
  - [ ] [Action item] - [Owner if identifiable] - [Due date if mentioned]
  - [ ] [Action item] - [Owner if identifiable] - [Due date if mentioned]

  ## DECISIONS MADE
  - **Decision**: [What was decided]
    - **Context**: [Why this decision was made]
    - **Impact**: [Who/what is affected]

  ## DEADLINES & TIME REFERENCES
  | When | What | Context |
  |------|------|---------|
  | [Date/Time] | [Event/Deadline] | [Additional context] |

  ## SPEAKERS & CONTRIBUTIONS
  [If multiple speakers identified]
  - **[Speaker identifier]**: [Key points they made]

  ## TECHNICAL TERMS & CONCEPTS
  - **[Term]**: [Definition or context from content]

  ## OPEN QUESTIONS & FOLLOW-UPS
  - [ ] [Unresolved question requiring follow-up]
  - [ ] [Topic that needs further discussion]

  ## PROACTIVE RECOMMENDATIONS
  Based on the content, consider:
  1. [Suggested next step]
  2. [Related topic to explore]
  3. [Potential risk or opportunity to address]

  ## TONE & URGENCY
  - **Overall Tone**: [Formal/Casual/Technical/Collaborative/etc.]
  - **Urgency Level**: [High/Medium/Low] - [Reasoning]
  - **Emotional Indicators**: [Any notable emotional context]

  ---

  ## RULES:
  1. Adapt sections based on content type - omit irrelevant sections
  2. Extract ALL dates, times, and deadlines mentioned
  3. Preserve speaker attribution when identifiable
  4. Capture technical terms with their contextual meaning
  5. Be proactive - suggest follow-ups and highlight risks
  6. Use concrete, specific language - avoid vague statements
  7. If information is unclear, note it rather than guessing
  8. Maintain chronological order for events/deadlines
  9. Format action items as checkboxes for usability
  10. Output ONLY the summary - no meta-commentary

  ## CONTENT TO ANALYZE:
  {text}