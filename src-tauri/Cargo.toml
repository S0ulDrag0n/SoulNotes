[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Audio capture
cpal = "0.15"
hound = "3.5"
tokio = { version = "1", features = ["sync", "rt"] }

# YAML config
serde_yaml = "0.9"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }

# Async streaming
futures-util = "0.3"

# Regex for conversation metadata extraction
regex = "1"

# Encryption for API tokens at rest
aes-gcm = "0.10"
base64 = "0.22"
machine-uid = "0.5"
sha2 = "0.10"

# Platform-specific dependencies for sleep prevention
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winbase", "powerbase", "errhandlingapi", "mmdeviceapi", "propsys", "propkey", "wtypes"] }
# WASAPI for loopback capture
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Media_Multimedia",
    "Win32_System_Com_StructuredStorage",
    "Win32_Devices_Properties",
    "Win32_System_Memory",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-foundation-sys = "0.8"
